[project]
name = "themis"
version = "0.1.0"
description = "Topological Heuristics for Ethical Model Inspection & Scoring — investigating how AI systems can account for historical redlining bias."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.3",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "seaborn>=0.13.2",
]

[project.urls]
Repository = "https://github.com/lusanmanso/themis"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.7",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["output", "*.parquet", "*.csv", "*.json", "*.avro"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E401", "I001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/themis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
